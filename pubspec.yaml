name: stdeel
description: 思谛 STDeel - 拍照识题与 AI 解题学习软件
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # 本地数据库
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0

  # AI API 调用
  langchain_core: ^0.3.0
  langchain_openai: ^0.3.0
  dio: ^5.4.0

  # 拍照/选图
  image_picker: ^1.0.7

  # UI 组件
  flutter_gen_ai_chat_ui: ^2.0.0

  # LaTeX 渲染
  flutter_tex: ^4.0.0

  # 本地通知
  flutter_local_notifications: ^17.0.0

  # 状态管理
  provider: ^6.1.0

  # 工具
  path_provider: ^2.1.0
  path: ^1.9.0
  crypto: ^3.0.0
  shared_preferences: ^2.2.0

  # 补充依赖
  fl_chart: ^0.67.0   # 知识点雷达图
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
